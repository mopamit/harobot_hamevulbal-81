:root{--blue:#17365e;--green:#6db580;--mustard:#e7b976;--bordo:#832058;--line:#6f7f8f;--bg:#f7f5ef;--card:#fff;--border:#e6e1d6;--radius:22px;
  --ui:"Simpler Pro","Segoe UI",Arial,sans-serif;--math:"Times New Roman",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--blue);font-family:var(--ui);font-size:18px;line-height:1.5}
[hidden]{display:none!important}
button{font-family:var(--ui)}
:focus-visible{outline:3px solid var(--bordo);outline-offset:3px}
.m{direction:ltr;unicode-bidi:isolate;font-family:var(--math);white-space:nowrap;font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-family:var(--math);font-weight:700;direction:ltr}
.frac i{font-style:normal;padding:0 3px}.frac i:first-child{border-bottom:1.6px solid currentColor;padding-bottom:1px}.frac i:last-child{padding-top:1px}

.topbar{direction:ltr;display:grid;grid-template-columns:minmax(120px,1fr) auto minmax(120px,1fr);align-items:center;gap:14px;padding:8px clamp(10px,3vw,26px);background:var(--card);border-bottom:1px solid var(--border)}
.topbar .logo{height:42px;width:auto;display:block;justify-self:start}
.topbar h1{direction:rtl;text-align:center;margin:0;color:var(--bordo);font-weight:700;font-size:clamp(20px,2.4vw,28px);white-space:nowrap}
.topbar .icons{direction:rtl;display:flex;align-items:center;gap:6px;justify-self:end}
.icon-btn{width:48px;height:48px;padding:3px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.icon-btn img{width:42px;height:42px;display:block}
.icon-btn:hover img{filter:brightness(1.25)}

.screen{max-width:1080px;margin:14px auto;padding:0 clamp(10px,3vw,24px)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 10px rgba(23,54,94,.05);padding:clamp(14px,2.2vw,22px)}
h2{color:var(--bordo);font-size:clamp(26px,3vw,31px);margin:0 0 8px;line-height:1.25}
.btn{font-size:19px;font-weight:700;border-radius:28px;padding:8px 24px 8px 12px;min-height:54px;cursor:pointer;border:0;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn img{width:36px;height:36px}
.btn.primary{background:var(--green);color:#10301c}
.btn.secondary{background:#fff;color:var(--blue);border:1.5px solid #cdd6e2}
.btn.text{background:transparent;color:var(--blue);padding:6px 10px;min-height:48px;font-weight:600;font-size:17px}
.btn.text img{width:32px;height:32px}

.center{max-width:820px;margin:20px auto;text-align:center}
.center p{font-size:19px;margin:8px 0}
.center .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,3vw,30px);margin:6px auto 8px}
.hero svg{width:clamp(88px,20vw,150px);height:auto}
.trophy{width:88px;height:88px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.summary div{background:#fbf8f1;border:1px solid var(--border);border-radius:16px;padding:12px 6px;display:grid;justify-items:center;gap:2px;font-size:16px}
.summary img{width:34px;height:34px}.summary strong{font-size:24px}

.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:4px 12px 4px 6px;font-size:17px}
.stat img{width:30px;height:30px}.stat b{min-width:1.2em;text-align:center}
.progress{display:flex;gap:5px;direction:rtl;align-items:center}
.progress span{width:18px;height:8px;border-radius:4px;background:#e9e4d8}
.progress span.first{background:var(--green)}.progress span.later{background:var(--mustard)}.progress span.now{background:var(--bordo)}

.feedback{margin:0;border-radius:14px;font-size:18px}
.feedback:not(:empty){padding:10px 14px}
.feedback.ok{background:rgba(109,181,128,.14);border:1.5px solid var(--green)}
.feedback.bad{background:rgba(231,185,118,.16);border:1.5px solid var(--mustard)}
.feedback.hint{background:#f3f6fa;border:1.5px solid #cdd6e2}
.feedback b{color:var(--bordo)}
.answer-actions{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;min-height:54px}
dialog{border:0;border-radius:var(--radius);padding:24px 26px;max-width:620px;color:var(--blue);font-family:var(--ui)}
dialog::backdrop{background:rgba(23,54,94,.35)}
dialog li{margin:6px 0}dialog li img{width:26px;height:26px;vertical-align:middle;margin-inline-end:4px}
.menu-items{display:grid;gap:10px;margin:14px 0}.menu-items .btn{justify-content:flex-start;width:100%}
.dialog-close{display:flex;justify-content:center;margin-top:12px}

/* ===== הרובוט המבולבל ===== */
:root{--f1:#832058;--f2:#17365e}           /* המספר הראשון (הצעדים) בבורדו; המספר השני (אורך הצעד והמבט) בכחול — בכל המשחק */
.screen{max-width:1180px}
.startbg{position:relative;border-radius:18px;overflow:hidden;margin:4px auto 10px;max-width:760px;box-shadow:0 6px 18px rgba(23,54,94,.12);line-height:0}
.startbg img.bg{width:100%;display:block}
.startbg img.who{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);height:66%;width:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.m.eq{display:block;text-align:center;white-space:normal;font-size:22px;margin:3px 0;color:var(--blue)}
.scene-card{padding:8px;margin-bottom:14px}
.scene-scroll{overflow-x:auto;direction:ltr;border-radius:16px;scrollbar-width:thin}
#scene{display:block;width:100%;min-width:860px;height:auto;aspect-ratio:1200/400;direction:ltr;user-select:none;-webkit-user-select:none}
#scene text{font-family:"Times New Roman",Georgia,serif;font-weight:700}
#rob{transition:transform .56s linear}
#rob.instant{transition:none}
.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:14px;align-items:start}
.story{font-size:18px;margin:0 0 8px}
.story b{color:var(--bordo)}
.expr{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;font-family:var(--math);font-weight:700;font-size:36px;color:var(--blue);margin:4px 0 12px}
.expr .fac{border-radius:14px;padding:2px 14px;border:2.5px solid;background:#fff;min-width:1.6em;text-align:center;unicode-bidi:isolate}
.expr .f1{border-color:var(--f1);color:var(--f1)}.expr .f2{border-color:var(--f2);color:var(--f2)}
.expr .res{color:#2f6b40}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}
.group{direction:rtl}
.group{border-radius:16px;padding:8px 10px 10px;border:2px solid}
.group.g1{border-color:rgba(131,32,88,.4);background:rgba(131,32,88,.04)}.group.g2{border-color:rgba(23,54,94,.35);background:rgba(23,54,94,.04)}
.group h4{margin:0 0 2px;font-size:17px}.group.g1 h4{color:var(--f1)}.group.g2 h4{color:var(--f2)}
.group p{margin:0 0 6px;font-size:16px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{font:700 17px var(--ui);min-height:48px;border-radius:14px;border:2px solid var(--border);background:#fff;color:var(--blue);cursor:pointer;padding:4px 6px;line-height:1.2}
.tg:hover:not(:disabled){border-color:var(--blue)}
.g1 .tg.on{background:var(--f1);border-color:var(--f1);color:#fff}.g2 .tg.on{background:var(--f2);border-color:var(--f2);color:#fff}
.tg:disabled{cursor:default;opacity:.55}.tg.on:disabled{opacity:1}
.lockn{font-size:14px;color:#7d6a3a;font-weight:700;margin-top:4px}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 8px;direction:ltr}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;font:700 24px var(--math);cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper strong{font:700 28px var(--math);min-width:1.4em;text-align:center}
.q{font-size:18px;font-weight:700;margin:12px 0 6px}
.options{display:grid;gap:8px;direction:ltr}
.options.c2{grid-template-columns:repeat(2,1fr)}.options.c4{grid-template-columns:repeat(4,1fr)}
.opt{font-family:var(--math);font-weight:700;font-size:24px;direction:ltr;unicode-bidi:isolate;padding:6px 8px;border-radius:14px;border:2px solid var(--border);background:#fff;color:var(--blue);cursor:pointer;min-height:52px;text-align:center}
.opt.txt{font:700 17px var(--ui);direction:rtl}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:#eef3f8;box-shadow:inset 0 0 0 2px var(--blue)}
.opt.correct{border-color:var(--green);background:rgba(109,181,128,.16);box-shadow:none}
.opt.wrong{border-color:var(--mustard);background:rgba(231,185,118,.14);color:#7d8a99;box-shadow:none}
.opt:disabled{cursor:default}
.runrow{display:flex;justify-content:center;margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px auto;max-width:640px;text-align:right}
.rules div{background:#fbf8f1;border:1px solid var(--border);border-radius:14px;padding:8px 12px;font-size:16px}
.rules .m{display:block;font-size:20px;text-align:left}
@media (max-width:900px){.workspace{grid-template-columns:1fr}}
@media (max-width:600px){
  .topbar{grid-template-columns:auto 1fr;gap:8px}.topbar .logo{height:30px}
  .topbar h1{grid-column:1/-1;grid-row:2;font-size:21px}.topbar .icons{grid-column:2;grid-row:1}
  .icon-btn{width:44px;height:44px}.icon-btn img{width:36px;height:36px}
  .stat{font-size:15px;padding:3px 8px 3px 4px}.stat img{width:24px;height:24px}
  .progress span{width:12px}
  .summary{grid-template-columns:1fr}
  .groups{grid-template-columns:1fr}.expr{font-size:30px}
  .options.c4{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <img class="logo" data-i="logo" alt="Prismind – פריזמה">
  <h1>הרובוט המבולבל</h1>
  <div class="icons">
    <button class="icon-btn" id="homeBtn" type="button" aria-label="מסך הבית" hidden><img data-i="homeC" alt=""></button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="תפריט" hidden><img data-i="menu" alt=""></button>
    <button class="icon-btn" id="helpBtn" type="button" aria-label="עזרה"><img data-i="help" alt=""></button>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="השתקת צלילים" aria-pressed="false"><img id="muteImg" alt=""></button>
  </div>
</header>

<section class="screen" id="startScreen">
  <div class="card center" style="max-width:860px">
    <h2>הרובוט המבולבל</h2>
    <div class="startbg"><img class="bg" data-g="start-bg" alt="מעבדת רובוטים"><img class="who" data-g="robot-confused" alt="רובוט מבולבל"></div>
    <p>הרובוט מקבל פקודות כתרגילי כפל, אבל הסימנים מבלבלים אותו: לאן להסתכל? ללכת קדימה או אחורה?</p>
    <p><b>תכנתו את הרובוט, גלו לאן הוא מגיע על ציר המספרים, והביאו אותו אל הסוללות.</b></p>
    <div class="actions">
      <button class="btn primary" id="startBtn" type="button"><img data-i="play" alt=""><span>יוצאים לדרך</span></button>
      <button class="btn secondary" id="newBtn" type="button" hidden><img data-i="restart" alt=""><span>משחק חדש</span></button>
      <button class="btn secondary" id="startHelpBtn" type="button"><img data-i="help" alt=""><span>איך משחקים?</span></button>
    </div>
  </div>
</section>

<section class="screen" id="gameScreen" hidden>
  <div class="statusbar">
    <div class="stats">
      <span class="stat"><img data-i="levels" alt=""><span>משימה <b id="taskNum">1</b> מתוך 12</span></span>
      <span class="stat"><img data-i="coins" alt=""><span>מטבעות <b id="coinsVal">0</b></span></span>
      <span class="stat"><img data-i="streak" alt=""><span>רצף <b id="streakVal">0</b></span></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </div>
  <div class="card scene-card"><div class="scene-scroll" id="sceneScroll"><svg id="scene" viewBox="0 0 1200 400" role="img" aria-label="ציר המספרים והרובוט"></svg></div></div>
  <div class="workspace">
    <div class="card" id="controls"></div>
    <div class="card">
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="answer-actions">
        <button class="btn text" id="hintBtn" type="button"><img data-i="hint" alt=""><span>רמז</span></button>
        <button class="btn primary" id="nextBtn" type="button" hidden><img data-i="next" alt=""><span id="nextLabel">למשימה הבאה</span></button>
      </div>
    </div>
  </div>
</section>

<section class="screen" id="endScreen" hidden>
  <div class="card center" style="max-width:880px">
    <h2>הרובוט כבר לא מבולבל!</h2>
    <div class="startbg"><img class="bg" data-g="end-bg" alt="מעבדת רובוטים"><img class="who" data-g="robot-battery-pose" alt="הרובוט מניף סוללה"></div>
    <p id="endText"></p>
    <div class="rules" id="rules"></div>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="btn primary" id="againBtn" type="button"><img data-i="restart" alt=""><span>משחק חדש</span></button>
      <button class="btn secondary" id="endHomeBtn" type="button"><img data-i="home" alt=""><span>מסך הבית</span></button>
    </div>
  </div>
</section>

<dialog id="dlg" aria-labelledby="dlgTitle"><div id="dlgBody"></div><div class="dialog-close"><button class="btn secondary" id="dlgClose" type="button"><img data-i="back" alt=""><span>חזרה</span></button></div></dialog>

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const N=v=>v<0?'−'+(-v):String(v);
const NP=v=>v<0?`(−${-v})`:String(v);
const mul=(n,s)=>`${NP(n)} · ${NP(s)}`;
const sg=v=>v<0?-1:1;
/* המוסכמה (כמו בסרטון ובצוללת): n · s = "n פעמים s".
   המספר הראשון n – מספר הצעדים; הסימן שלו: + הולך קדימה, − הולך אחורה.
   המספר השני s – אורך כל צעד; הסימן שלו: + מסתכל ימינה, − מסתכל שמאלה.
   הרובוט אינו מסתובב בזמן ההליכה. המיקום הסופי על הציר הוא n · s. */
const WALK=v=>v>0?'הלך קדימה':'הלך אחורה',LOOK=v=>v>0?'הסתכל ימינה':'הסתכל שמאלה',SIDE=v=>v>0?'ימינה':'שמאלה';
const NQ=12,LIM=20;

/* ====================== מחולל המשימות ====================== */
function makeTasks(){
  const T=[],used=new Set();
  let a,b;do{a=rnd(2,4);b=rnd(2,5);}while(a===b||a*b>LIM);used.add(a+'x'+b);
  for(const [x,y] of [[1,1],[1,-1],[-1,1],[-1,-1]])T.push({part:'A',n:x*a,s:y*b});       // אותם מספרים, ארבעה צירופי סימנים
  const combos=shuffle([[1,1],[1,-1],[-1,1],[-1,-1]]);combos.push(pick([[1,-1],[-1,1],[-1,-1]]));
  for(const [x,y] of combos){let n,s;do{n=rnd(2,5);s=rnd(2,6);}while(n*s>LIM||used.has(n+'x'+s));used.add(n+'x'+s);
    const c=x*y*n*s,k=sg(c),cand=shuffle([{v:k*(n+s),kind:'sum'},{v:c-k*s,kind:'fewer'},{v:c+k*s,kind:'more'}]).filter(o=>Math.abs(o.v)<=LIM&&o.v!==c&&o.v!==-c&&o.v!==0);
    const seen=new Set([c,-c]),extra=[];for(const o of cand){if(!seen.has(o.v)&&extra.length<2){seen.add(o.v);extra.push(o);}}
    T.push({part:'B',n:x*n,s:y*s,opts:[{v:c,ok:true},{v:-c,kind:'sign'},...extra].sort((p,q)=>p.v-q.v)});}
  const prods=shuffle([6,8,10,12,14,15,16,18,20]);
  T.push({part:'C',target:prods[0],lock:{face:-1},story:'התקלה: הראש של הרובוט נתקע, והוא מסתכל רק <b>שמאלה</b>.'});
  T.push({part:'C',target:-prods[1],lock:{walk:-1},story:'התקלה: המנוע של הרובוט עובד רק <b>אחורה</b>.'});
  T.push({part:'C',target:prods[2],lock:{walk:-1},story:'התקלה: המנוע של הרובוט עדיין עובד רק <b>אחורה</b>.'});
  return T;
}

/* ====================== הזירה: ציר המספרים ====================== */
const X=v=>600+v*27,AY=300;
function drawScene(){
  const t=cur();
  let o=`<image href="${IMG['track-bg']}" x="0" y="0" width="1200" height="400" preserveAspectRatio="none"/>
   <line x1="${X(-LIM)-16}" y1="${AY}" x2="${X(LIM)+22}" y2="${AY}" stroke="#17365e" stroke-width="3.2" stroke-linecap="round"/><path d="M${X(LIM)+34} ${AY} l-16 -8 v16 z" fill="#17365e"/>
   <line x1="${X(0)}" y1="252" x2="${X(0)}" y2="${AY}" stroke="#832058" stroke-width="2" stroke-dasharray="4 6" opacity=".6"/>`;
  for(let v=-LIM;v<=LIM;v++){const big=v%5===0;o+=`<line x1="${X(v)}" y1="${AY-(big?11:6)}" x2="${X(v)}" y2="${AY+(big?11:6)}" stroke="${v===0?'#832058':'#17365e'}" stroke-width="${big?3:1.8}"/>`;
    if(big)o+=`<text x="${X(v)}" y="${AY+46}" text-anchor="middle" font-size="${v===0?32:28}" fill="${v===0?'#832058':'#17365e'}">${N(v)}</text>`;}
  o+=`<g id="arcs"></g>`;
  if(t.part==='C')o+=`<g id="bat" transform="translate(${X(t.target)} ${AY})"><ellipse cx="0" cy="2" rx="30" ry="6" fill="rgba(23,54,94,.18)"/><image href="${IMG.battery}" x="-41" y="-92" width="82" height="90"/></g>`;
  o+=`<g id="rob" class="instant" style="transform:translate(${X(0)}px,${AY}px)"><ellipse cx="0" cy="3" rx="44" ry="8" fill="rgba(23,54,94,.2)"/>
     <g id="flip">${['stand','step','step2','back','back2','happy','confused','battery-pose'].map(p=>`<image class="pose" data-p="${p}" href="${IMG['robot-'+p]}" x="-61.4" y="-213" width="122.8" height="216" opacity="${p==='stand'?1:0}"/>`).join('')}</g>
     <text id="qm" x="34" y="-190" font-size="58" fill="#e7b976" stroke="#832058" stroke-width="2.5" paint-order="stroke" opacity="0">?</text><g id="tag" opacity="0"><rect x="-44" y="-262" width="88" height="46" rx="15" fill="#832058" stroke="#fff" stroke-width="2.5"/><text id="tagT" x="0" y="-228" text-anchor="middle" font-size="31" fill="#fff">0</text></g></g>`;
  $('#scene').innerHTML=o;S.pos=0;requestAnimationFrame(()=>{const r=$('#rob');r&&r.classList.remove('instant');});centerOn(0,false);
}
function pose(p){document.querySelectorAll('#scene .pose').forEach(im=>im.setAttribute('opacity',im.dataset.p===p?1:0));const q=$('#qm');if(q)q.setAttribute('opacity',p==='confused'?1:0);}
function face(dir){const f=$('#flip');if(f)f.setAttribute('transform',dir<0?'scale(-1 1)':'');}
function centerOn(v,smooth=true){const sc=$('#sceneScroll'),svg=$('#scene');if(sc.scrollWidth<=sc.clientWidth+2)return;const k=svg.getBoundingClientRect().width/1200;sc.scrollTo({left:X(v)*k-sc.clientWidth/2,behavior:smooth?'smooth':'auto'});}
function place(v,instant){const r=$('#rob');if(instant)r.classList.add('instant');r.style.transform=`translate(${X(v)}px,${AY}px)`;S.pos=v;if(instant)requestAnimationFrame(()=>r.classList.remove('instant'));}
function tag(v){const g=$('#tag');if(v===null){g.setAttribute('opacity','0');return;}$('#tagT').textContent=N(v);g.setAttribute('opacity','1');}
function resetRobot(){if(!$('#rob'))return;$('#arcs').innerHTML='';place(0,true);tag(null);pose('stand');centerOn(0);}
function arc(p0,p1){const x0=X(p0),x1=X(p1),d=x1>x0?1:-1;
  $('#arcs').insertAdjacentHTML('beforeend',`<path d="M${x0} ${AY-3} Q${(x0+x1)/2} ${AY-58} ${x1} ${AY-3}" fill="none" stroke="#17365e" stroke-width="4" stroke-linecap="round"/><path d="M${x1} ${AY-2} l${-d*13} -3 l${d*5} -13 z" fill="#17365e"/>`);}
async function walk(n,s){ // |n| צעדים באורך |s|; המבט לפי הסימן של s, קדימה/אחורה לפי הסימן של n
  const id=S.run,dir=sg(n)*sg(s);face(sg(s));tag(null);pose('stand');
  for(let j=1;j<=Math.abs(n);j++){const p0=S.pos,p1=p0+dir*Math.abs(s);place(p1);centerOn(p1);
    // הליכה קדימה: רגל מושטת לפנים; הליכה אחורה (רוורס): רגל מושטת לאחור, והמבט נשאר קדימה
    for(const [ms,p] of n>0?[[0,'step'],[200,'stand'],[390,'step2']]:[[0,'back'],[200,'stand'],[390,'back2']]){setTimeout(()=>{if(S.run===id)pose(p);},ms);}
    await sleep(580);if(S.run!==id)return false;pose('stand');arc(p0,p1);await sleep(170);if(S.run!==id)return false;}
  tag(S.pos);return true;
}

/* ====================== צלילים ====================== */
let muted=false;try{muted=localStorage.getItem('prisma-robot-muted')==='true';}catch{}
const audio=Object.fromEntries(Object.entries(SOUND).map(([k,v])=>{const a=new Audio(v);a.preload='auto';a.volume=.4;return [k,a];}));
let soundTimer;
function stopAudio(){clearTimeout(soundTimer);Object.values(audio).forEach(a=>{a.pause();a.currentTime=0;});}
function play(k){stopAudio();if(muted)return;const a=audio[k];a.play().catch(()=>{});soundTimer=setTimeout(()=>a.pause(),k==='finish'?4500:1300);}
function updateMute(){const b=$('#muteBtn');b.setAttribute('aria-pressed',String(muted));b.setAttribute('aria-label',muted?'הפעלת צלילים':'השתקת צלילים');$('#muteImg').src=muted?ICON.mute:ICON.speaker;}

/* ====================== מהלך ====================== */
let S=null;
function newGame(){S={tasks:makeTasks(),qi:0,coins:0,first:0,streak:0,best:0,results:[],active:true,run:0};show('game');startTask();}
function show(name){
  for(const n of ['start','game','end'])$('#'+n+'Screen').hidden=n!==name;
  $('#homeBtn').hidden=name==='start';$('#menuBtn').hidden=name!=='game';
  if(name==='start'){const going=S&&S.active;$('#startBtn span').textContent=going?'המשך המשחק':'יוצאים לדרך';$('#newBtn').hidden=!going;}
  window.scrollTo({top:0});
}
function stats(){
  $('#taskNum').textContent=Math.min(S.qi+1,NQ);$('#coinsVal').textContent=S.coins;$('#streakVal').textContent=S.streak;
  $('#progress').innerHTML=Array.from({length:NQ},(_,k)=>`<span class="${k<S.results.length?(S.results[k]?'first':'later'):k===S.qi?'now':''}"></span>`).join('');
}
function feedback(html,kind){const f=$('#feedback');f.innerHTML=html;f.className='feedback'+(kind?' '+kind:'');
  if(html&&kind!=='hint'&&matchMedia('(max-width:900px)').matches)f.scrollIntoView({block:'nearest',behavior:'smooth'});}
const cur=()=>S.tasks[S.qi];
function startTask(){
  const t=cur();S.run++;S.clean=true;S.tries=0;S.done=false;S.busy=false;S.dirty=false;
  S.walk=t.lock&&t.lock.walk||null;S.face=t.lock&&t.lock.face||null;S.pred=null;S.absN=2;S.absS=2;S.wrongOpts=new Set();
  feedback(t.part==='A'?'בחרו איך הרובוט הולך ולאן הוא מסתכל, נבאו לאן יגיע, והפעילו אותו.':t.part==='B'?'תכנתו את הרובוט, בחרו את נקודת הסיום, ורק אז הפעילו אותו.':'בנו תרגיל שיביא את הרובוט בדיוק אל הסוללה.','hint');
  $('#nextBtn').hidden=true;$('#hintBtn').hidden=false;drawScene();if(S.face)face(S.face);renderControls();stats();
}
// הגורמים כפי שהתלמיד תכנת (בחלק ג') או כפי שנתונים (בחלקים א'–ב')
const curN=()=>{const t=cur();return t.part==='C'?(S.walk===null?null:S.walk*S.absN):t.n;};
const curS=()=>{const t=cur();return t.part==='C'?(S.face===null?null:S.face*S.absS):t.s;};
function renderControls(){
  const t=cur(),dis=S.busy||S.done?'disabled':'',A=t.part==='A',C=t.part==='C',n=curN(),s=curS();
  const tg=(role,val,label,locked)=>`<button class="tg ${S[role]===val?'on':''}" type="button" data-role="${role}" data-v="${val}" aria-pressed="${S[role]===val}" ${dis||locked?'disabled':''}>${label}</button>`;
  const lw=C&&t.lock.walk,lf=C&&t.lock.face;
  const res=S.done&&n!==null&&s!==null?`<span class="res">${N(n*s)}</span>`:'<span>?</span>';
  let h=`${C?`<p class="story">${t.story} הביאו אותו אל הסוללה שבנקודה ${M(N(t.target))}.</p>`:`<p class="story">${A?'הפקודה של הרובוט:':'פקודה חדשה. לאן הרובוט יגיע?'}</p>`}
   <div class="expr" aria-label="התרגיל"><span class="fac f1">${n===null?'?':NP(n)}</span><span>·</span><span class="fac f2">${s===null?'?':NP(s)}</span><span>=</span>${res}</div>
   <div class="groups">
    <div class="group g1"><h4>המספר הראשון: הצעדים</h4>
      ${C?`<div class="stepper"><button type="button" data-st="N" data-d="-1" aria-label="פחות צעדים" ${dis||S.absN<=1?'disabled':''}>−</button><strong>${S.absN}</strong><button type="button" data-st="N" data-d="1" aria-label="יותר צעדים" ${dis||S.absN>=8?'disabled':''}>+</button></div><p>מספר הצעדים</p>`:`<p>הרובוט עושה ${M(Math.abs(t.n))} צעדים. איך הוא הולך?</p>`}
      <div class="toggle">${tg('walk',1,A?'קדימה (+)':'קדימה',lw)}${tg('walk',-1,A?'אחורה (−)':'אחורה',lw)}</div>${lw?'<div class="lockn">נעול: רק אחורה</div>':''}</div>
    <div class="group g2"><h4>המספר השני: אורך הצעד והמבט</h4>
      ${C?`<div class="stepper"><button type="button" data-st="S" data-d="-1" aria-label="צעד קצר יותר" ${dis||S.absS<=1?'disabled':''}>−</button><strong>${S.absS}</strong><button type="button" data-st="S" data-d="1" aria-label="צעד ארוך יותר" ${dis||S.absS>=8?'disabled':''}>+</button></div><p>אורך כל צעד</p>`:`<p>כל צעד באורך ${M(Math.abs(t.s))}. לאן הרובוט מסתכל?</p>`}
      <div class="toggle" style="direction:ltr">${tg('face',-1,A?'שמאלה (−)':'שמאלה',lf)}${tg('face',1,A?'ימינה (+)':'ימינה',lf)}</div>${lf?'<div class="lockn">נעול: רק שמאלה</div>':''}</div>
   </div>`;
  if(A)h+=`<p class="q">לאיזה צד של האפס הרובוט יגיע?</p><div class="options c2">${[[-1,'שמאלה מהאפס'],[1,'ימינה מהאפס']].map(([v,l])=>`<button class="opt txt ${S.done?(v===sg(t.n*t.s)?'correct':S.pred===v?'wrong':''):S.pred===v?'sel':''}" type="button" data-pred="${v}" ${dis}>${l}</button>`).join('')}</div>`;
  if(t.part==='B')h+=`<p class="q">באיזו נקודה על הציר הרובוט ייעצר?</p><div class="options c4">${t.opts.map(o=>`<button class="opt ${S.wrongOpts.has(o.v)?'wrong':S.done?(o.ok?'correct':S.pred===o.v?'wrong':''):S.pred===o.v?'sel':''}" type="button" data-pred="${o.v}" ${dis||S.wrongOpts.has(o.v)?'disabled':''}>${N(o.v)}</button>`).join('')}</div>`;
  const ready=S.walk!==null&&S.face!==null&&(C||S.pred!==null);
  h+=`<div class="runrow"><button class="btn primary" id="runBtn" type="button" ${S.busy||S.done||!ready?'disabled':''}><img src="${ICON.play}" alt=""><span>הפעלת הרובוט</span></button></div>`;
  $('#controls').innerHTML=h;
}
$('#controls').addEventListener('click',e=>{
  if(!S||S.busy||S.done)return;const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.id==='runBtn'){run();return;}
  if(S.dirty){resetRobot();S.dirty=false;feedback('');}
  if(b.dataset.role){S[b.dataset.role]=+b.dataset.v;if(b.dataset.role==='face')face(S.face);}
  else if(b.dataset.pred!==undefined)S.pred=+b.dataset.pred;
  else if(b.dataset.st){const k='abs'+b.dataset.st;S[k]=Math.max(1,Math.min(8,S[k]+ +b.dataset.d));}
  renderControls();
});
function miss(html){S.tries++;S.clean=false;S.streak=0;play('error');stats();if(html)feedback(html,'bad');}
function finishTask(html){
  const first=S.clean;S.done=true;S.busy=false;S.coins+=first?2:1;if(first){S.first++;S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0;
  S.results.push(first);feedback(html,first?'ok':'bad');if(first)play('success');renderControls();
  $('#nextLabel').textContent=S.qi===NQ-1?'לסיום':'למשימה הבאה';$('#nextBtn').hidden=false;$('#hintBtn').hidden=true;stats();$('#nextBtn').focus({preventScroll:true});
}
function why(n,s){const r=n*s;return `הרובוט ${LOOK(s)} ו${WALK(n)}, ולכן התקדם <b>${SIDE(r)}</b>: ${M(Math.abs(n))} צעדים באורך ${M(Math.abs(s))}.`;}
async function run(){
  const t=cur();if(S.busy||S.done)return;
  if(t.part!=='C'){
    const wOK=S.walk===sg(t.n),fOK=S.face===sg(t.s);
    if(!wOK||!fOK){pose('confused');S.dirty=true;
      miss(`<b>הרובוט מבולבל.</b> ${!wOK?`בדקו את המספר הראשון, ${M(NP(t.n))}: הסימן שלו קובע אם הרובוט הולך קדימה או אחורה.`:`בדקו את המספר השני, ${M(NP(t.s))}: הסימן שלו קובע לאן הרובוט מסתכל.`} תקנו והפעילו שוב.`);return;}
    const c=t.n*t.s;
    if(t.part==='B'&&S.pred!==c&&S.tries<1){const o=t.opts.find(x=>x.v===S.pred);S.wrongOpts.add(S.pred);S.pred=null;pose('confused');S.dirty=true;
      miss(`<b>עדיין לא.</b> ${o.kind==='sign'?`המרחק מהאפס נכון, אבל הצד לא. הרובוט ${LOOK(t.s).replace('הסתכל','מסתכל')} ו${WALK(t.n).replace('הלך','הולך')}: לאיזה צד הוא מתקדם בפועל?`
        :o.kind==='sum'?`חיברתם ${M(Math.abs(t.n))} ו־${M(Math.abs(t.s))}. אבל הרובוט עושה ${M(Math.abs(t.n))} צעדים, וכל אחד מהם באורך ${M(Math.abs(t.s))}.`
        :`ספרו שוב את הצעדים: הרובוט עושה בדיוק ${M(Math.abs(t.n))} צעדים באורך ${M(Math.abs(t.s))}.`} בחרו שוב.`);renderControls();return;}
    S.busy=true;renderControls();feedback('הרובוט יוצא לדרך…','hint');
    if(!(await walk(t.n,t.s)))return;
    const good=t.part==='A'?S.pred===sg(c):S.pred===c;
    if(!good){S.clean=false;S.streak=0;S.tries++;play('error');}
    pose(good?'happy':'stand');
    const surprise=t.n<0&&t.s<0?' מינוס כפול מינוס נותן תוצאה חיובית!':'';
    finishTask(`<b>${good?'נכון!':t.part==='A'?'הרובוט הגיע דווקא לצד השני.':'כך זה עובד:'}</b> ${EQ(`${mul(t.n,t.s)} = ${N(c)}`)} ${why(t.n,t.s)}${surprise}`);
    return;
  }
  const n=curN(),s=curS(),r=n*s;
  if(Math.abs(r)>LIM){feedback(`המסלול הזה יוצא מהציר, שמגיע עד ${M(LIM)}. בחרו מספרים קטנים יותר.`,'hint');return;}
  S.busy=true;renderControls();feedback('הרובוט יוצא לדרך…','hint');
  if(!(await walk(n,s)))return;
  if(r===t.target){const b=$('#bat');if(b)b.remove();pose('battery-pose');
    finishTask(`<b>הסוללה נאספה!</b> ${EQ(`${mul(n,s)} = ${N(r)}`)} ${why(n,s)}${n<0&&s<0?' מינוס כפול מינוס נותן תוצאה חיובית!':''}`);return;}
  S.busy=false;S.dirty=true;pose('confused');
  miss(`<b>עדיין לא.</b> הרובוט הגיע ל־${M(N(r))}, והסוללה נמצאת ב־${M(N(t.target))}. ${sg(r)!==sg(t.target)?'הוא התקדם לצד הלא נכון. איזה כיוון אפשר לשנות?':'הצד נכון. שנו את מספר הצעדים או את אורך הצעד.'}`);renderControls();
}
$('#nextBtn').onclick=()=>{if(!S.done)return;if(S.qi<NQ-1){S.qi++;startTask();return;}finish();};
$('#hintBtn').onclick=()=>{if(!S||S.done)return;const t=cur();
  const H=t.part==='A'?`הסימן של המספר הראשון קובע איך הולכים: פלוס קדימה, מינוס אחורה. הסימן של המספר השני קובע לאן מסתכלים: פלוס ימינה, מינוס שמאלה.`
    :t.part==='B'?`קבעו קודם לאיזה צד הרובוט יתקדם בפועל, לפי המבט וההליכה. אחר כך חשבו כמה רחוק: מספר הצעדים כפול אורך הצעד.`
    :`המרחק של הסוללה מהאפס הוא ${M(Math.abs(t.target))}. חפשו מספר צעדים ואורך צעד שהמכפלה שלהם היא ${M(Math.abs(t.target))}, וקבעו את הכיוון החופשי כך שהרובוט יתקדם ${SIDE(t.target)}.`;
  feedback(`<b>רמז:</b> ${H}`,'hint');};
function finish(){
  S.active=false;S.run++;
  $('#endText').innerHTML=`השלמתם ${M(NQ)} משימות, ו־${M(S.first)} מהן בלי אף טעות. זה מה שגיליתם:`;
  $('#rules').innerHTML=[[3,2,'מסתכל ימינה והולך קדימה'],[3,-2,'מסתכל שמאלה והולך קדימה'],[-3,2,'מסתכל ימינה והולך אחורה'],[-3,-2,'מסתכל שמאלה והולך אחורה']]
    .map(([n,s,d])=>`<div>${d} – מתקדם ${SIDE(n*s)}<span class="m">${mul(n,s)} = ${N(n*s)}</span></div>`).join('');
  $('#summary').innerHTML=`<div><img src="${ICON.coins}" alt=""><span>מטבעות</span><strong>${S.coins}</strong></div><div><img src="${ICON.star}" alt=""><span>בלי טעויות</span><strong>${S.first} מתוך ${NQ}</strong></div><div><img src="${ICON.streak}" alt=""><span>הרצף הארוך</span><strong>${S.best}</strong></div>`;
  show('end');play('finish');
}

/* ====================== ניווט ====================== */
function dialog(html){stopAudio();$('#dlgBody').innerHTML=html;$('#dlg').showModal();}
$('#dlgClose').onclick=()=>$('#dlg').close();
const HELP=`<h2 id="dlgTitle">איך משחקים?</h2>
<p>הרובוט עומד על ציר המספרים בנקודה ${M(0)}. כל פקודה היא תרגיל כפל, למשל ${M('3 · (−2)')}.</p>
<ul><li><b style="color:var(--f1)">המספר הראשון</b> הוא מספר הצעדים. הסימן שלו קובע איך הרובוט הולך: פלוס – קדימה, מינוס – אחורה.</li>
<li><b style="color:var(--f2)">המספר השני</b> הוא אורך כל צעד. הסימן שלו קובע לאן הרובוט מסתכל: פלוס – ימינה, מינוס – שמאלה.</li>
<li>הרובוט לא מסתובב בזמן ההליכה. כשהוא הולך אחורה, הוא זז בכיוון ההפוך למבט שלו.</li></ul>
<ul><li>בתחילה מתכנתים את הרובוט ומנבאים לאיזה צד יגיע. אחר כך מנבאים את הנקודה המדויקת, ובסוף בונים תרגיל שמביא אותו אל הסוללה.</li>
<li><img src="${ICON.coins}" alt="">מטבעות: משימה בלי אף טעות — 2 מטבעות; משימה עם טעות — מטבע אחד. <img src="${ICON.hint}" alt="">רמז לא מוריד מטבעות.</li>
<li><img src="${ICON.streak}" alt="">רצף: כמה משימות ברצף הושלמו בלי טעות. טעות מאפסת את הרצף.</li></ul>`;
$('#helpBtn').onclick=()=>dialog(HELP);$('#startHelpBtn').onclick=()=>dialog(HELP);
$('#menuBtn').onclick=()=>{dialog(`<h2 id="dlgTitle">תפריט</h2><div class="menu-items"><button class="btn secondary" id="mResume" type="button"><img src="${ICON.play}" alt=""><span>המשך המשחק</span></button><button class="btn secondary" id="mRestart" type="button"><img src="${ICON.restart}" alt=""><span>משחק חדש</span></button><button class="btn secondary" id="mHome" type="button"><img src="${ICON.home}" alt=""><span>מסך הבית</span></button></div>`);
  $('#mResume').onclick=()=>$('#dlg').close();$('#mRestart').onclick=()=>{$('#dlg').close();newGame();};$('#mHome').onclick=()=>{$('#dlg').close();stopAudio();show('start');};};
$('#homeBtn').onclick=()=>{stopAudio();show('start');};$('#endHomeBtn').onclick=()=>{stopAudio();show('start');};
$('#startBtn').onclick=()=>{if(S&&S.active)show('game');else newGame();};
$('#newBtn').onclick=newGame;$('#againBtn').onclick=newGame;
$('#muteBtn').onclick=()=>{muted=!muted;stopAudio();updateMute();try{localStorage.setItem('prisma-robot-muted',String(muted));}catch{}};
updateMute();
window.__rob={get S(){return S;},makeTasks};
</script>
